services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    # Render's default web port is 10000; the gateway must listen there so the
    # internal health check at :10000/startupz passes on the free tier.
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured --bind lan
    healthCheckPath: /startupz
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"
      - key: OPENCLAW_STATE_DIR
        value: /home/node/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /home/node/.openclaw/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
